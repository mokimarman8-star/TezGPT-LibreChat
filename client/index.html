<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="tezgpt-api-origin" content="%VITE_API_ORIGIN%" />
    <meta name="theme-color" content="#171717" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="TezGPT - Your branded AI assistant with multiple models and tools"
    />
    <title>TezGPT</title>
    <link rel="icon" type="image/svg+xml" href="assets/tezgpt-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="assets/icon-192x192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
    </style>
    <script>
      const theme = localStorage.getItem('color-theme');
      const loadingContainerStyle = document.createElement('style');
      let backgroundColor;

      if (theme === 'dark') {
        backgroundColor = '#171717';
      } else if (theme === 'light') {
        backgroundColor = '#ffffff';
      } else if (theme === 'system') {
        const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
        backgroundColor = prefersDarkScheme ? '#0d0d0d' : '#ffffff';
      } else {
        backgroundColor = '#ffffff';
      }

      document.documentElement.style.backgroundColor = backgroundColor;

      loadingContainerStyle.innerHTML = `
        html,
        body,
        #root {
          background-color: ${backgroundColor};
        }
        #tezgpt-boot-shell {
          position: fixed;
          inset: 0;
          z-index: 2147483647;
          opacity: 1;
          pointer-events: auto;
          transition: opacity 180ms cubic-bezier(0.23, 1, 0.32, 1);
        }
        #tezgpt-boot-shell.tezgpt-boot-shell--exit {
          opacity: 0;
          pointer-events: none;
        }
        #tezgpt-boot-shell #loading-container {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background-color: ${backgroundColor};
          color: ${backgroundColor === '#0d0d0d' ? '#f5f5f5' : '#171717'};
          font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          text-align: center;
        }
        #tezgpt-boot-shell .tezgpt-boot-mark {
          width: 42px;
          height: 42px;
          margin-bottom: 18px;
          border: 2px solid #10a37f;
          border-radius: 14px 14px 4px 14px;
          box-shadow: inset 0 0 0 7px ${backgroundColor};
          transform: rotate(45deg);
        }
        #tezgpt-boot-shell .tezgpt-boot-name {
          font-size: 22px;
          font-weight: 800;
          letter-spacing: 0.18em;
          margin-left: 0.18em;
        }
        #tezgpt-boot-shell .tezgpt-boot-status {
          margin-top: 10px;
          color: #10a37f;
          font-size: 12px;
          font-weight: 600;
          letter-spacing: 0.08em;
          text-transform: uppercase;
        }
        @media (prefers-reduced-motion: no-preference) {
          #tezgpt-boot-shell .tezgpt-boot-mark {
            animation: tezgpt-boot-pulse 1.5s ease-in-out infinite;
          }
        }
        @keyframes tezgpt-boot-pulse {
          0%, 100% { opacity: 0.6; transform: rotate(45deg) scale(0.94); }
          50% { opacity: 1; transform: rotate(45deg) scale(1); }
        }
      `;
      document.head.appendChild(loadingContainerStyle);

      window.addEventListener('tezgpt:app-ready', function () {
        var shell = document.getElementById('tezgpt-boot-shell');
        if (!shell || shell.dataset.dismissed === 'true') {
          return;
        }
        shell.dataset.dismissed = 'true';
        shell.classList.add('tezgpt-boot-shell--exit');
        window.setTimeout(function () {
          shell.remove();
        }, 220);
      });
    </script>
    <script>
      (function () {
        var KEY = 'lc-asset-recovery-at';
        var RUM_QUEUE_KEY = 'lc-rum-queue';
        var MAX_RUM_QUEUE = 20;
        window.__lcRumRecoveryGuardInstalled = true;
        window.__lcRumQueue = Array.isArray(window.__lcRumQueue) ? window.__lcRumQueue : [];
        try {
          var persistedQueue = JSON.parse(sessionStorage.getItem(RUM_QUEUE_KEY) || '[]');
          if (Array.isArray(persistedQueue)) {
            window.__lcRumQueue = persistedQueue.concat(window.__lcRumQueue).slice(-MAX_RUM_QUEUE);
          }
        } catch (e) {
          /* Diagnostics should never affect application startup. */
        }
        window.__lcRumPush = function (type, attributes) {
          try {
            var safeAttributes = {};
            Object.keys(attributes || {}).forEach(function (key) {
              var value = attributes[key];
              if (
                typeof value !== 'string' &&
                typeof value !== 'number' &&
                typeof value !== 'boolean'
              ) {
                return;
              }
              safeAttributes[key] = value;
            });
            if (window.__lcRumQueue.length >= MAX_RUM_QUEUE) {
              window.__lcRumQueue.shift();
            }
            window.__lcRumQueue.push({
              type: type,
              at: Math.round(performance.now()),
              visibilityState: document.visibilityState,
              attributes: safeAttributes,
            });
            sessionStorage.setItem(RUM_QUEUE_KEY, JSON.stringify(window.__lcRumQueue));
          } catch (e) {
            /* Diagnostics should never affect application startup. */
          }
        };
        function shouldRecover() {
          try {
            var last = Number(sessionStorage.getItem(KEY)) || 0;
            if (Date.now() - last < 60000) {
              return false;
            }
            sessionStorage.setItem(KEY, String(Date.now()));
            return true;
          } catch (e) {
            return false;
          }
        }
        window.__lcRecoverStaleAssets = function () {
          if (!shouldRecover()) {
            return false;
          }
          window.__lcRumPush('stale-asset-recovery-start');
          var reload = function () {
            window.__lcRumPush('stale-asset-recovery-reload');
            window.location.reload();
          };
          if (navigator.serviceWorker) {
            var scopeBase = new URL('./', document.baseURI || window.location.href).href;
            navigator.serviceWorker
              .getRegistrations()
              .then(function (registrations) {
                return Promise.all(
                  registrations
                    .filter(function (registration) {
                      return registration.scope.indexOf(scopeBase) === 0;
                    })
                    .map(function (registration) {
                      return registration.unregister();
                    }),
                );
              })
              .then(reload, reload);
          } else {
            reload();
          }
          return true;
        };
        if (navigator.serviceWorker) {
          navigator.serviceWorker.addEventListener('message', function (event) {
            if (!event.data || event.data.type !== 'LC_SW_PING') {
              return;
            }
            var source = event.source || navigator.serviceWorker.controller;
            if (source) {
              source.postMessage({ type: 'LC_SW_PONG' });
            }
          });
        }
        window.addEventListener(
          'error',
          function (event) {
            var el = event.target;
            if (!el || !el.tagName) {
              return;
            }
            var failedScript = el.tagName === 'SCRIPT' && el.src;
            var failedPreload =
              el.tagName === 'LINK' && /preload/.test(el.rel || '') && /\.js$/.test(el.href || '');
            if (failedScript || failedPreload) {
              var isRumBootstrap = el.getAttribute('data-lc-rum-bootstrap') === 'true';
              window.__lcRumPush('asset-load-error', {
                tagName: el.tagName,
                assetUrl: el.src || el.href,
                optional: isRumBootstrap,
              });
              if (isRumBootstrap) {
                return;
              }
              window.__lcRecoverStaleAssets();
            }
          },
          true,
        );
        window.addEventListener('unhandledrejection', function (event) {
          var message = event.reason && event.reason.message;
          if (
            typeof message === 'string' &&
            (message.indexOf('dynamically imported module') !== -1 ||
              message.indexOf('Importing a module script failed') !== -1)
          ) {
            window.__lcRumPush('dynamic-import-error');
            window.__lcRecoverStaleAssets();
          }
        });
      })();
    </script>
    <script
      data-lc-rum-bootstrap="true"
      type="module"
      src="/src/lib/rum/bootstrap-entry.js"
    ></script>
    <script defer type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root"></div>
    <div id="tezgpt-boot-shell" role="status" aria-live="polite">
      <div id="loading-container" role="status" aria-live="polite">
        <div class="tezgpt-boot-mark" aria-hidden="true"></div>
        <div class="tezgpt-boot-name">TEZGPT</div>
        <div class="tezgpt-boot-status">Loading secure workspace</div>
      </div>
    </div>
  </body>
</html>
