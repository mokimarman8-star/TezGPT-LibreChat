name: Deploy TezGPT frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'packages/data-provider/**'
      - '.github/workflows/deploy-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tezgpt-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit
      - name: Build static TezGPT frontend
        env:
          VITE_GITHUB_PAGES: 'true'
          VITE_API_ORIGIN: https://tezgpt.onrender.com
        run: npm run frontend:pages
      - name: Add single-page app fallback
        run: cp client/dist/index.html client/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
